plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'rss-automessage-neoforge' }

repositories {
    maven { name = 'Xander Maven'; url = 'https://maven.isxander.dev/releases' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java.srcDir('src/client/java')
        resources.exclude('assets/rss-automessage/icon720-450.png')
    }
    txtTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
    }
    mods {
        rss_automessage { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'neo_version', project.neo_version
    inputs.property 'yacl_version', project.yacl_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minecraft_version: project.minecraft_version,
                neo_version: project.neo_version, yacl_version: project.yacl_version)
    }
}

tasks.register('txtLibraryTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.txtTest.runtimeClasspath
    mainClass = 'cn.islys.util.TextFileLibraryTest'
}

tasks.register('messageListEditorTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.txtTest.runtimeClasspath
    mainClass = 'cn.islys.config.MessageListEditorTest'
}

tasks.named('check') {
    dependsOn tasks.named('txtLibraryTest'), tasks.named('messageListEditorTest')
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
