plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.29'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'rss-automessage-forge' }

repositories {
    exclusiveContent {
        forRepository { maven { url = layout.projectDirectory.dir('.gradle-agent/yacl-repository') } }
        filter { includeModule('dev.svyaton', 'yacl-reforged') }
    }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java.srcDir('src/client/java')
        resources.exclude('assets/rss-automessage/icon720-450.png')
    }
    txtTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Forge's generated development POM adds compile-time annotations to runtime.
// YACL already provides this module via JarJar; keep only that copy at launch.
configurations.matching {
    it.name == 'runtimeClasspath' || it.name.endsWith('RuntimeClasspath')
}.configureEach {
    exclude group: 'org.jetbrains', module: 'annotations'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
    }
}

jarJar.register {
    archiveClassifier = null
    destinationDirectory = layout.buildDirectory.dir('libs')
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${project.eventbus_validator_version}"
    implementation "dev.svyaton:yacl-reforged:${project.yacl_version}"
    jarJar("dev.svyaton:yacl-reforged:${project.yacl_version}") { dependency ->
        jarJar.configure(dependency) { range = "[${project.yacl_version}]" }
    }
    // Forge detects mixins only on root mods. Nested YACL needs this explicit
    // request for Forge's existing optional MixinExtras library.
    jarJar("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}") { dependency ->
        jarJar.configure(dependency) {
            constraint = true
            range = "[${project.mixinextras_version},)"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_version', project.forge_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'yacl_version', project.yacl_version
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, minecraft_version: project.minecraft_version,
                forge_version: project.forge_version, loader_version: project.loader_version,
                yacl_version: project.yacl_version)
    }
}

tasks.register('txtLibraryTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.txtTest.runtimeClasspath
    mainClass = 'cn.islys.util.TextFileLibraryTest'
}

tasks.register('messageListEditorTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.txtTest.runtimeClasspath
    mainClass = 'cn.islys.config.MessageListEditorTest'
}

tasks.named('check') {
    dependsOn tasks.named('txtLibraryTest'), tasks.named('messageListEditorTest')
}

jar {
    archiveClassifier = 'slim'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
    from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}

tasks.named('sourcesJar') {
    from('LICENSE')
    from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jarJar')
            artifact tasks.named('sourcesJar')
        }
    }
}
