// ./gradlew --init-script scripts/forge-smoke.init.gradle runSmokeClient
// A separate dev mod, excluded from normal builds and release archives.
allprojects {
    afterEvaluate { project ->
        def smoke = project.sourceSets.create('smoke') {
            java.srcDirs = [project.file('src/smoke/java')]
            resources.srcDirs = [project.file('src/smoke/resources')]
            compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
            runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
        }
        project.configurations.smokeImplementation.extendsFrom(project.configurations.implementation)
        project.configurations.smokeRuntimeOnly.extendsFrom(project.configurations.runtimeOnly)
        project.configurations.smokeAnnotationProcessor.extendsFrom(project.configurations.annotationProcessor)
        def directory = project.file('run/qa-forge-' + project.minecraft_version + '-' + System.currentTimeMillis())
        directory.mkdirs()
        new File(directory, 'config').mkdirs()
        new File(directory, 'options.txt').setText('lang:zh_cn\nguiScale:2\nfullscreen:false\nrenderDistance:4\nsimulationDistance:5\nmaxFps:30\nsoundCategory_master:0.0\n', 'UTF-8')
        new File(directory, 'config/rss-automessage.json').setText(
                '{"enableScheduledMessages":false,"sendOnJoin":false,"enableAutoReply":false,"scheduledMessageList":[],"selectedTextFile":""}', 'UTF-8')
        println 'Forge smoke game directory: ' + directory
        project.minecraft.runs.named('client') {
            with(smoke) {
                workingDir = directory
                def assets = System.getenv('AUTOMESSAGE_ASSETS')
                if (assets) {
                    systemProperty 'net.minecraftforge.launcher.skip.assets', 'true'
                    inheritArgs = false
                    args '--launchTarget', 'forge_userdev_client', '--version', 'MOD_DEV',
                            '--assetIndex', '{asset_index}', '--assetsDir', assets, '--gameDir', '.'
                }
                args '--width', '1280', '--height', '720', '--username', 'AutoMessageQA'
            }
        }
    }
}
